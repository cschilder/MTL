name: Android APK

# Builds the Trusted Web Activity wrapper.
#
# There is no Gradle wrapper checked in: gradle-wrapper.jar is a binary, and a
# binary in a repository is something nobody reviews. The action installs
# Gradle instead, which is both reproducible and auditable.
#
# A debug APK is built on every push that touches android/. A signed release
# APK and AAB are built for a tag, if the signing secrets are configured; if
# they are not, the release artefacts are produced unsigned and can be signed
# afterwards with apksigner.

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**']
  # A version tag produces the release build.
  create:
  workflow_dispatch:
    inputs:
      release:
        description: 'Build a signed release APK'
        type: boolean
        default: false

# write: the workflow publishes the built APK as a release asset, which is
# the only artefact form that can be downloaded without a GitHub login — the
# phone that needs the file has none.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mtl-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The same APK, but reachable from a phone: artifact downloads demand a
      # GitHub login, release assets on a public repository do not. The moving
      # tag app-latest always carries the newest build, so the download link
      # never changes.
      - name: Publish the APK under the app-latest release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: MTL Android-app (nieuwste build)
          body: |
            De meest recente APK van de MTL-app, automatisch gebouwd.
            Download het .apk-bestand hieronder op je telefoon en installeer het.
            Weigert Android vanwege een afwijkende handtekening, verwijder dan
            eerst de oude app en installeer opnieuw.
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/*.apk

      # ---------------------------------------------------------------------
      # Release
      # ---------------------------------------------------------------------

      - name: Restore the signing keystore
        id: keystore
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          KEYSTORE_BASE64: ${{ secrets.MTL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret is configured; the release build will be unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Written outside the workspace so it cannot be picked up by a later
          # step that archives the checkout.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mtl.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK and bundle
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        working-directory: android
        env:
          MTL_KEYSTORE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/mtl.keystore', runner.temp) || '' }}
          MTL_KEYSTORE_PASSWORD: ${{ secrets.MTL_KEYSTORE_PASSWORD }}
          MTL_KEY_ALIAS: ${{ secrets.MTL_KEY_ALIAS }}
          MTL_KEY_PASSWORD: ${{ secrets.MTL_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Report the signing fingerprint
        if: steps.keystore.outputs.signed == 'true'
        env:
          MTL_KEYSTORE_PASSWORD: ${{ secrets.MTL_KEYSTORE_PASSWORD }}
          MTL_KEY_ALIAS: ${{ secrets.MTL_KEY_ALIAS }}
        run: |
          # This fingerprint has to go into the site's Android settings, or
          # Android cannot verify the domain and the app opens with an address
          # bar. Printing it here saves digging it out of the keystore later.
          echo "::group::SHA-256 fingerprint for /.well-known/assetlinks.json"
          keytool -list -v \
            -keystore "$RUNNER_TEMP/mtl.keystore" \
            -alias "$MTL_KEY_ALIAS" \
            -storepass "$MTL_KEYSTORE_PASSWORD" \
            | grep -A1 'SHA256:' | head -2
          echo "::endgroup::"

      - name: Upload release artefacts
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: mtl-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mtl.keystore"
