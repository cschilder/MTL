# Gradle and Android build settings.

# 2 GB is enough for a single-module wrapper and keeps the build inside the
# memory a free CI runner offers.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# The wrapper contains no Java of its own worth shrinking, and R8 on an empty
# module only adds build time.
android.enableR8.fullMode=false

android.nonTransitiveRClass=true
