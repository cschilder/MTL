; PHP settings for MTL on Strato "Hosting Advanced".
;
; Strato runs PHP as FastCGI, where php_value directives inside .htaccess cause
; a 500. A .user.ini in the document root is the supported way to override
; PER_DIR settings there. Changes take up to `user_ini.cache_ttl` (300s by
; default) to become visible.

; Media uploads. The chunked uploader in app/Http/Controllers/UploadController
; keeps individual requests small, so these are ceilings rather than targets.
upload_max_filesize = 64M
post_max_size = 68M
max_file_uploads = 40

; Image variant generation on a large photo is the slowest request the app
; makes; everything else finishes in milliseconds.
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; Never leak stack traces to visitors. The application installs its own error
; handler and writes to storage/logs/ instead.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Sessions: harden the cookie and keep the ID out of URLs.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 43200

; Timezone used for date formatting when a request has no user preference.
date.timezone = Europe/Amsterdam
